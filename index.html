<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語 並べ替え問題</title>
<style>
  :root {
    --bg: #fff5fa;
    --panel: #ffffff;
    --text: #3d3450;
    --muted: #7a6d8c;
    --line: #f0e3f5;
    --accent: #c2417f;
    --accent-dark: #a8336c;
    --accent-2: #8a5cd6;
    --card: #ffffff;
    --card-border: #e8d8f2;
    --answer-bg: #fdf6ff;
    --answer-border: #d9b8f0;
    --ok: #1f8a57;
    --ok-bg: #e3f8ec;
    --ok-border: #8fdcb1;
    --ng: #c73c5a;
    --ng-bg: #ffe9ee;
    --ng-border: #f5a3b5;
    /* カードのパステルカラー */
    --p1: #ffd6e5; --p1b: #f5a8c6;
    --p2: #ffe3c7; --p2b: #f5bf8a;
    --p3: #fff4bd; --p3b: #eed56b;
    --p4: #d4f5e2; --p4b: #92d9b1;
    --p5: #d6ecff; --p5b: #95c6f0;
    --p6: #e7dcff; --p6b: #b9a0ee;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 8%, #ffe0ee 0, transparent 38%),
      radial-gradient(circle at 92% 20%, #e3f1ff 0, transparent 36%),
      radial-gradient(circle at 15% 88%, #e2f8ec 0, transparent 38%),
      radial-gradient(circle at 88% 85%, #fff3c9 0, transparent 36%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }
  header h1 {
    font-size: 1.35rem;
    margin: 6px 0 14px;
    text-align: center;
    letter-spacing: .04em;
    background: linear-gradient(90deg, #d9468f, #8a5cd6 55%, #3f8fd9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header h1 .deco { color: initial; -webkit-text-fill-color: initial; font-size: 1.1rem; }
  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .bar {
    flex: 1;
    height: 12px;
    background: #fff;
    box-shadow: inset 0 0 0 2px var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffa8c9, #c7a8ff, #9fd4ff, #9fe3bf);
    transition: width .4s;
  }
  .panel {
    background: var(--panel);
    border-radius: 22px;
    padding: 20px 16px;
    box-shadow: 0 6px 20px rgba(200, 120, 180, .15);
    border: 2px solid #fbe7f3;
  }
  .qno {
    display: inline-block;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(90deg, #d9468f, #8a5cd6);
    border-radius: 999px;
    padding: 2px 14px;
    font-size: 0.9rem;
  }
  .ja {
    font-size: 1.1rem;
    font-weight: bold;
    margin: 4px 0 14px;
  }
  .label {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .answer {
    min-height: 64px;
    border: 3px dashed var(--answer-border);
    background: var(--answer-bg);
    border-radius: 16px;
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .answer.ok { border-style: solid; border-color: var(--ok-border); background: var(--ok-bg); }
  .answer.ng { border-style: solid; border-color: var(--ng-border); background: var(--ng-bg); }
  .placeholder {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0 4px;
  }
  .end-mark {
    font-size: 1.15rem;
    font-weight: bold;
    margin-left: -4px;
  }
  .pool {
    min-height: 56px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .card {
    font: inherit;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 1.1rem;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--card-border);
    border-bottom-width: 4px;
    border-radius: 14px;
    padding: 8px 14px;
    box-shadow: 0 2px 0 rgba(0,0,0,.04);
    min-height: 48px;
    min-width: 48px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s;
  }
  .card.c0 { background: var(--p1); border-color: var(--p1b); }
  .card.c1 { background: var(--p2); border-color: var(--p2b); }
  .card.c2 { background: var(--p3); border-color: var(--p3b); }
  .card.c3 { background: var(--p4); border-color: var(--p4b); }
  .card.c4 { background: var(--p5); border-color: var(--p5b); }
  .card.c5 { background: var(--p6); border-color: var(--p6b); }
  .card:hover:not(:disabled) { transform: translateY(-2px); }
  .card:active { transform: translateY(2px); }
  .card:disabled { cursor: default; }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .buttons {
    display: flex;
    gap: 10px;
  }
  .btn {
    font: inherit;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 999px;
    padding: 12px 18px;
    min-height: 52px;
    cursor: pointer;
    border: 2px solid #eccbe0;
    background: #fff;
    color: var(--accent);
    touch-action: manipulation;
  }
  .btn.primary {
    flex: 1;
    border: none;
    background: linear-gradient(90deg, #c2417f, #8250cc);
    color: #fff;
    box-shadow: 0 4px 12px rgba(160, 70, 160, .25);
  }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: default; }
  .result {
    margin-top: 16px;
    border-radius: 18px;
    padding: 14px;
    display: none;
  }
  .result.show { display: block; animation: pop .35s ease-out; }
  @keyframes pop {
    0% { transform: scale(.92); opacity: 0; }
    70% { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .result.show { animation: none; }
    .card, .bar > span { transition: none; }
  }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.ng { background: var(--ng-bg); color: var(--ng); }
  .result .title { font-size: 1.3rem; font-weight: bold; }
  .result .correct {
    color: var(--text);
    margin-top: 6px;
    font-size: 1rem;
  }
  .result .correct b {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 1.05rem;
  }
  .result .exp {
    margin-top: 10px;
    padding: 10px 12px;
    background: #fff;
    border-radius: 12px;
    font-size: 0.95rem;
  }
  .result .exp:empty { display: none; }
  .result .buttons { margin-top: 12px; }
  .hidden { display: none !important; }

  /* 結果画面 */
  .score {
    text-align: center;
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--accent);
    margin: 4px 0;
    background: linear-gradient(90deg, #d9468f, #8a5cd6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .score small { font-size: 1.1rem; -webkit-text-fill-color: var(--muted); }
  .comment { text-align: center; margin: 0 0 16px; }
  .review { list-style: none; padding: 0; margin: 0 0 18px; }
  .review li {
    display: flex;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }
  .review .mark { font-weight: bold; font-size: 1.1rem; width: 1.4em; flex-shrink: 0; text-align: center; }
  .review .mark.ok { color: var(--ok); }
  .review .mark.ng { color: var(--ng); }
  .review .en { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .review .jp { color: var(--muted); font-size: 0.85rem; }
  #summary .buttons { flex-direction: column-reverse; }
  .howto {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 12px;
  }
  @media (max-width: 380px) {
    .card { font-size: 1rem; padding: 6px 11px; }
    .btn { padding: 10px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="deco" aria-hidden="true">🌈</span> 英語 並べ替え問題 <span class="deco" aria-hidden="true">✨</span></h1>
  </header>

  <!-- 問題画面 -->
  <section id="quiz">
    <div class="progress">
      <span id="progressText">第1問 / 10問</span>
      <div class="bar"><span id="progressBar"></span></div>
    </div>

    <div class="panel">
      <p class="howto">単語カードをタップして、日本語に合う英文になるように並べましょう。並べたカードをタップすると下に戻せます。</p>
      <div class="qno" id="qno">第1問</div>
      <div class="ja" id="ja"></div>

      <p class="label">あなたの解答</p>
      <div class="answer" id="answer" aria-live="polite"></div>

      <p class="label">単語カード</p>
      <div class="pool" id="pool"></div>

      <div class="buttons" id="mainButtons">
        <button class="btn" id="resetBtn" type="button">リセット</button>
        <button class="btn primary" id="checkBtn" type="button" disabled>答え合わせ</button>
      </div>

      <div class="result" id="result" aria-live="polite">
        <div class="title" id="resultTitle"></div>
        <div class="correct" id="resultCorrect"></div>
        <div class="exp" id="resultExp"></div>
        <div class="buttons">
          <button class="btn" id="retryBtn" type="button">もう一度</button>
          <button class="btn" id="showBtn" type="button">正解を見る</button>
          <button class="btn primary" id="nextBtn" type="button">次の問題へ</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="summary" class="hidden">
    <div class="panel">
      <p class="label" style="text-align:center">結果（1回目の答え合わせで正解した数）</p>
      <div class="score"><span id="scoreNum">0</span><small> / <span id="scoreTotal">10</span>問</small></div>
      <p class="comment" id="scoreComment"></p>
      <ul class="review" id="review"></ul>
      <div class="buttons">
        <button class="btn" id="retryWrongBtn" type="button">まちがえた問題だけ</button>
        <button class="btn primary" id="restartBtn" type="button">最初からやり直す</button>
      </div>
    </div>
  </section>
</div>

<script src="questions.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  // 出題する問題のリスト（QUESTIONS の番号）
  var order = [];
  var pos = 0;             // order の何番目を解いているか
  var firstResult = {};    // 問題番号 -> 1回目の答え合わせの結果（true/false）
  var checkedOnce = false; // この問題で答え合わせをしたか

  // 現在の問題のカード（同じ単語が2つあっても区別できるよう id を付ける）
  var cards = [];          // { id, text }
  var placed = [];         // 解答欄に置いたカードの id（順番どおり）

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sentence(q, words) {
    return (words || q.words).join(" ") + (q.end || "");
  }

  function currentQ() { return QUESTIONS[order[pos]]; }

  function start(list) {
    order = list;
    pos = 0;
    firstResult = {};
    $("summary").classList.add("hidden");
    $("quiz").classList.remove("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    var q = currentQ();
    var n = pos + 1;
    $("progressText").textContent = "第" + n + "問 / " + order.length + "問";
    $("progressBar").style.width = (pos / order.length * 100) + "%";
    $("qno").textContent = "第" + (order[pos] + 1) + "問";
    $("ja").textContent = q.ja;

    var base = q.words.map(function (w, i) { return { id: i, text: cardText(q, w, i) }; });
    // 正解と同じ並びにならないようにシャッフル
    var shuffled = shuffle(base);
    var tries = 0;
    while (q.words.length > 1 && isCorrectOrder(q, shuffled.map(function (c) { return c.text; })) && tries < 20) {
      shuffled = shuffle(base);
      tries++;
    }
    cards = shuffled;
    placed = [];
    checkedOnce = false;
    hideResult();
    render();
    window.scrollTo(0, 0);
  }

  // 文頭の語は小文字にしてカードにする（"I" と capital: true の問題はそのまま）
  function cardText(q, w, i) {
    if (i !== 0 || q.capital || w === "I") return w;
    return w.charAt(0).toLowerCase() + w.slice(1);
  }

  // 文頭を小文字にしているので、大文字・小文字を区別せずに比べる
  function isCorrectOrder(q, words) {
    var target = [q.words].concat(q.alt || []);
    var s = words.join(" ").toLowerCase();
    return target.some(function (t) { return t.join(" ").toLowerCase() === s; });
  }

  function showCorrect(q) {
    $("resultCorrect").innerHTML = "";
    $("resultCorrect").appendChild(document.createTextNode("正解： "));
    var b = document.createElement("b");
    b.textContent = sentence(q);
    $("resultCorrect").appendChild(b);
    $("resultExp").textContent = q.exp ? "解説： " + q.exp : "";
  }

  function makeCard(c, locked) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card c" + (c.id % 6);
    b.textContent = c.text;
    b.disabled = !!locked;
    return b;
  }

  function render() {
    var q = currentQ();
    var locked = $("result").classList.contains("show");
    var answer = $("answer");
    var pool = $("pool");
    answer.innerHTML = "";
    pool.innerHTML = "";

    if (placed.length === 0) {
      var ph = document.createElement("span");
      ph.className = "placeholder";
      ph.textContent = "ここに単語が並びます";
      answer.appendChild(ph);
    }
    placed.forEach(function (id, idx) {
      var c = findCard(id);
      var b = makeCard(c, locked);
      b.setAttribute("aria-label", c.text + "（タップで戻す）");
      b.addEventListener("click", function () {
        placed.splice(idx, 1);
        render();
      });
      answer.appendChild(b);
    });
    if (placed.length > 0 && q.end) {
      var end = document.createElement("span");
      end.className = "end-mark";
      end.textContent = q.end;
      answer.appendChild(end);
    }

    cards.forEach(function (c) {
      if (placed.indexOf(c.id) !== -1) return;
      var b = makeCard(c, locked);
      b.addEventListener("click", function () {
        placed.push(c.id);
        render();
      });
      pool.appendChild(b);
    });

    $("checkBtn").disabled = placed.length !== cards.length || locked;
    $("resetBtn").disabled = placed.length === 0 || locked;
  }

  function findCard(id) {
    for (var i = 0; i < cards.length; i++) if (cards[i].id === id) return cards[i];
  }

  function check() {
    var q = currentQ();
    var words = placed.map(function (id) { return findCard(id).text; });
    var ok = isCorrectOrder(q, words);
    if (!checkedOnce) {
      firstResult[order[pos]] = ok;
      checkedOnce = true;
    }
    showResult(ok, false);
  }

  function showResult(ok, revealed) {
    var q = currentQ();
    var res = $("result");
    res.className = "result show " + (ok ? "ok" : "ng");
    $("answer").className = "answer " + (ok ? "ok" : "ng");
    $("mainButtons").classList.add("hidden");

    if (ok) {
      $("resultTitle").textContent = "〇 正解！ 🎉";
      showCorrect(q);
    } else if (revealed) {
      $("resultTitle").textContent = "× 不正解";
      showCorrect(q);
    } else {
      $("resultTitle").textContent = "× 不正解";
      $("resultCorrect").textContent = "もう一度チャレンジするか、正解を確認しましょう。";
      $("resultExp").textContent = "";
    }

    $("retryBtn").classList.toggle("hidden", ok);
    $("showBtn").classList.toggle("hidden", ok || revealed);
    $("nextBtn").textContent = pos === order.length - 1 ? "結果を見る" : "次の問題へ";
    render();
  }

  function hideResult() {
    $("result").className = "result";
    $("answer").className = "answer";
    $("mainButtons").classList.remove("hidden");
  }

  function next() {
    if (pos < order.length - 1) {
      pos++;
      loadQuestion();
    } else {
      showSummary();
    }
  }

  function showSummary() {
    $("progressBar").style.width = "100%";
    $("quiz").classList.add("hidden");
    $("summary").classList.remove("hidden");

    var score = 0;
    var list = $("review");
    list.innerHTML = "";
    order.forEach(function (qi) {
      var q = QUESTIONS[qi];
      var ok = firstResult[qi] === true;
      if (ok) score++;
      var li = document.createElement("li");
      var mark = document.createElement("span");
      mark.className = "mark " + (ok ? "ok" : "ng");
      mark.textContent = ok ? "〇" : "×";
      var body = document.createElement("div");
      var en = document.createElement("div");
      en.className = "en";
      en.textContent = "第" + (qi + 1) + "問　" + sentence(q);
      var jp = document.createElement("div");
      jp.className = "jp";
      jp.textContent = q.ja;
      body.appendChild(en);
      body.appendChild(jp);
      li.appendChild(mark);
      li.appendChild(body);
      list.appendChild(li);
    });

    $("scoreNum").textContent = score;
    $("scoreTotal").textContent = order.length;
    var rate = score / order.length;
    $("scoreComment").textContent =
      rate === 1 ? "全問正解！すばらしい！ 🎉" :
      rate >= 0.7 ? "よくできました！ 🌟 まちがえた問題も復習しましょう。" :
      "まちがえた問題をもう一度解いてみましょう。 💪";

    var wrong = order.filter(function (qi) { return firstResult[qi] !== true; });
    $("retryWrongBtn").classList.toggle("hidden", wrong.length === 0);
    window.scrollTo(0, 0);
  }

  function allIndexes() {
    return QUESTIONS.map(function (_, i) { return i; });
  }

  $("checkBtn").addEventListener("click", check);
  $("resetBtn").addEventListener("click", function () { placed = []; render(); });
  $("retryBtn").addEventListener("click", function () { placed = []; hideResult(); render(); });
  $("showBtn").addEventListener("click", function () { showResult(false, true); });
  $("nextBtn").addEventListener("click", next);
  $("restartBtn").addEventListener("click", function () { start(allIndexes()); });
  $("retryWrongBtn").addEventListener("click", function () {
    start(order.filter(function (qi) { return firstResult[qi] !== true; }));
  });

  start(allIndexes());
})();
</script>
</body>
</html>
